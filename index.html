<style>
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --surface-2:#E8EEEE; --ink:#0F1F29; --ink-2:#4A5F6A; --line:#D3DDDF;
  --sea:#0B6E73; --sea-soft:#D6EDEC; --sun:#C9531F; --sun-soft:#FBE6DB; --leaf:#1F7A52; --leaf-soft:#DCF0E5;
  --b2b:#34489A; --b2b-soft:#E1E5F6;
  --log-bg:#0F1F29; --log-ink:#E7F0F1; --log-hot:#F59A6B;
  --wa-bg:#EAE6DF; --wa-in:#FFFFFF; --wa-out:#D6F5C9;
  --accent:var(--sea); --accent-soft:var(--sea-soft);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B161C; --surface:#12222B; --surface-2:#1A2E38; --ink:#E7F0F1; --ink-2:#9DB2BA; --line:#26404B;
    --sea:#4CC3C0; --sea-soft:#133A3E; --sun:#F08A5C; --sun-soft:#3A2218; --leaf:#5FCB93; --leaf-soft:#15342A;
    --b2b:#8FA2F0; --b2b-soft:#1E2748;
    --log-bg:#050D11; --log-ink:#DDE8EA; --log-hot:#F59A6B;
    --wa-bg:#0E1A1F; --wa-in:#1D2C33; --wa-out:#1F4A36;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B161C; --surface:#12222B; --surface-2:#1A2E38; --ink:#E7F0F1; --ink-2:#9DB2BA; --line:#26404B;
  --sea:#4CC3C0; --sea-soft:#133A3E; --sun:#F08A5C; --sun-soft:#3A2218; --leaf:#5FCB93; --leaf-soft:#15342A;
  --b2b:#8FA2F0; --b2b-soft:#1E2748;
  --log-bg:#050D11; --log-ink:#DDE8EA; --log-hot:#F59A6B;
  --wa-bg:#0E1A1F; --wa-in:#1D2C33; --wa-out:#1F4A36;
}
body.mode-b2b{--accent:var(--b2b); --accent-soft:var(--b2b-soft);}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--body); color:var(--ink); font-size:16px; line-height:1.55; padding-inline:clamp(16px,4vw,48px); padding-block:0 48px; transition:background .3s}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.wrap{max-width:1180px; margin:0 auto}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; justify-content:space-between; padding-block:14px; border-bottom:1px solid var(--line)}
.brand{display:flex; flex-direction:column; line-height:1.2}
.brand b{font-family:var(--display); font-size:17px}
.brand span{font-size:12px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.08em}
.top-right{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.tabs{display:flex; flex-wrap:wrap; gap:4px; background:var(--surface-2); padding:4px; border-radius:999px}
.tabs button{border:0; background:transparent; padding:8px 14px; border-radius:999px; font-weight:600; font-size:14px; color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.theme-btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600; display:flex; gap:8px; align-items:center}
.theme-btn .ico{width:16px; height:16px; border-radius:50%; background:var(--ink); box-shadow:inset -5px -2px 0 0 var(--surface)}

/* hero */
.hero{display:grid; grid-template-columns:1.3fr 1fr; gap:32px; align-items:end; padding-block:36px 28px}
.hero.solo{grid-template-columns:1fr}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.hero h1{font-size:clamp(34px,5.4vw,64px); line-height:1.02; font-weight:800; margin-top:10px}
.hero h1 em{font-style:normal; color:var(--accent)}
.hero p{color:var(--ink-2); max-width:62ch; margin:14px 0 0}
.persona{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; display:grid; gap:10px}
.persona .who{display:flex; gap:14px; align-items:center}
.avatar{width:84px; height:84px; object-fit:cover; object-position:50% 20%; border:3px solid var(--accent); border-radius:50%; flex:none; background:var(--surface-2)}
.persona h3{font-size:20px}
.persona small{color:var(--ink-2); font-size:13px}
.facts{display:grid; grid-template-columns:repeat(2,1fr); gap:8px 16px; margin:4px 0 0; font-size:14px}
.facts dt{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2)}
.facts dd{margin:0; font-weight:600}
.tag{display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:6px; background:var(--accent-soft); color:var(--accent); font-weight:600}

/* journey rail */
.rail{display:grid; grid-template-columns:repeat(4,1fr); position:relative; margin-block:8px 24px}
.rail::before{content:""; position:absolute; left:12.5%; right:12.5%; top:27px; height:3px; background:var(--line); border-radius:2px}
.rail .prog{position:absolute; left:12.5%; top:27px; height:3px; background:var(--accent); border-radius:2px; transition:width .5s ease}
.stage-btn{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 6px; position:relative; z-index:1; text-align:center}
.stage-btn .dot{width:56px; height:56px; border-radius:50%; background:var(--surface); border:3px solid var(--line); display:grid; place-items:center; font-family:var(--mono); font-weight:600; font-size:15px; transition:all .25s}
.stage-btn .lbl{font-family:var(--display); font-weight:700; font-size:16px; line-height:1.15}
.stage-btn .sub{font-size:12px; color:var(--ink-2)}
.stage-btn.done .dot{border-color:var(--accent); color:var(--accent)}
.stage-btn[aria-current="step"] .dot{background:var(--accent); border-color:var(--accent); color:var(--surface); transform:scale(1.08)}
.stage-btn:hover .dot{border-color:var(--accent)}

/* stage panel */
.stage{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start}
.stage-head{grid-column:1/-1; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:end; gap:12px}
.stage-head h2{font-size:clamp(26px,3.4vw,38px)}
.stage-head p{margin:6px 0 0; color:var(--ink-2); max-width:70ch}
.controls{display:flex; gap:8px; flex-wrap:wrap}
.ctl{border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:10px; font-size:14px; font-weight:600}
.ctl.primary{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.cards{display:grid; gap:14px; min-width:0}
.card{border-radius:16px; background:var(--surface); border:1px solid var(--line); overflow:hidden}
.card>button,.face>button.hd{width:100%; display:flex; align-items:center; gap:14px; background:none; border:0; padding:16px 20px; text-align:left}
.kind{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:6px; flex:none}
.ttl{font-family:var(--display); font-weight:700; font-size:18px; flex:1}
.chev{font-family:var(--mono); color:var(--ink-2); transition:transform .25s}
[data-open="true"] .chev{transform:rotate(90deg)}
.body{padding:0 20px 18px; display:none}
[data-open="true"] .body{display:block; animation:rise .35s ease}
@keyframes rise{from{opacity:.2; transform:translateY(6px)}to{opacity:1; transform:none}}
.k-beh .kind{background:var(--surface-2); color:var(--ink)}
.k-gap .kind{background:var(--sun-soft); color:var(--sun)}
.k-sol .kind{background:var(--leaf-soft); color:var(--leaf)}
.card ul,.face ul{margin:0; padding-left:20px; display:grid; gap:8px}
.sol-list{list-style:none; padding:0!important}
.sol-list li{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:baseline}
.prod{font-family:var(--mono); font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; white-space:nowrap; justify-self:start}
.p-mkt{background:var(--sea-soft); color:var(--sea)}
.p-crm{background:var(--b2b-soft); color:var(--b2b)}
.p-cnv{background:var(--leaf-soft); color:var(--leaf)}
.kpis{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line)}
.kpis span{font-size:13px; background:var(--surface-2); padding:4px 10px; border-radius:999px}
.kpis b{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); width:100%}
.flip-hint{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-top:14px; padding:10px 12px; border-radius:10px; background:var(--leaf-soft); color:var(--leaf); font-size:13px; font-weight:600}
.flip-hint button{border:0; background:var(--leaf); color:var(--surface); padding:6px 12px; border-radius:8px; font-size:13px; font-weight:700}

/* flip card */
.flipwrap{perspective:1800px}
.flipper{display:grid; transition:transform .75s cubic-bezier(.4,.1,.2,1); transform-style:preserve-3d}
.face{grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--leaf); overflow:hidden; align-self:start}
.k-gap .face{border-left-color:var(--sun)}
.k-gap .kind{background:var(--sun-soft); color:var(--sun)}
.k-gap .flip-hint{background:var(--sun-soft); color:var(--sun)}
.k-gap .flip-hint button{background:var(--sun)}
.p-gap{background:var(--sun-soft); color:var(--sun)}
.k-gap .scr{--accent:var(--ink-2)}
.m-big{font-family:var(--display); font-weight:800; font-size:40px; line-height:1; color:var(--sun)}
.m-tbl{width:100%; border-collapse:collapse; min-width:0; font-size:10.5px}
.m-tbl th,.m-tbl td{padding:4px 5px; border-bottom:1px solid var(--line); font-size:10.5px; text-align:left; vertical-align:top}
.m-tbl th{font-family:var(--mono); font-size:9px; text-transform:uppercase; color:var(--ink-2); letter-spacing:0; width:auto}
.m-tbl tr.hl td{background:var(--sun-soft); color:var(--sun); font-weight:700}
.ad-img{height:62px; border-radius:6px; background:linear-gradient(160deg,var(--surface-2),var(--line))}
.chat{display:grid; grid-template-columns:26px 1fr auto; gap:3px 8px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:6px}
.chat .av{width:26px; height:26px; border-radius:50%; background:var(--line); grid-row:span 2}
.chat .ms{color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chat .un{background:var(--leaf); color:var(--surface); border-radius:999px; font-size:9.5px; font-weight:700; padding:1px 6px; justify-self:end}
.chat .tm{font-family:var(--mono); font-size:9.5px; color:var(--sun)}
.mail{display:grid; grid-template-columns:1fr auto; gap:1px 8px; border-bottom:1px solid var(--line); padding-bottom:5px}
.mail.un b{color:var(--ink)} .mail span{color:var(--ink-2)}
.mail.fl{background:var(--sun-soft); margin:0 -10px; padding:5px 10px}
.sheet{display:grid; font-family:var(--mono); font-size:9.5px; border:1px solid var(--line); background:var(--surface)}
.sheet div{display:grid; border-bottom:1px solid var(--line)}
.sheet span{padding:4px 5px; border-right:1px solid var(--line); overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.sheet .h span{background:var(--surface-2); font-weight:600}
.sheet .bad{color:var(--sun); font-weight:600}
.stk{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.stk span{background:#F6E27A; color:#3A3413; padding:8px; border-radius:3px; font-size:11px; font-weight:600; box-shadow:0 2px 4px rgba(0,0,0,.15); transform:rotate(-2deg); font-family:"Comic Sans MS","Segoe Print",var(--body)}
.stk span:nth-child(even){transform:rotate(2deg); background:#FBC7A4}
.face.back{transform:rotateY(180deg); display:none; cursor:zoom-out}
.flipwrap.showback .face.back{display:block}
.flipwrap.flipped .flipper{transform:rotateY(180deg)}
.flipwrap .front .body{cursor:zoom-in}
.back-hd{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding:16px 20px 6px}
.back-hd .ttl{flex:none}
.back-note{padding:0 20px; font-size:12px; color:var(--ink-2)}
.shots{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; padding:14px 20px 20px}
.shot{display:grid; gap:8px; align-content:start}
.shot p{margin:0; font-size:13px; line-height:1.4; color:var(--ink-2)}

/* mock screens */
.scr{border:1px solid var(--line); border-radius:12px; background:var(--bg); overflow:hidden; height:250px; font-size:11.5px; line-height:1.35; display:flex; flex-direction:column; box-shadow:0 6px 18px rgba(10,30,40,.10)}
.scr .chrome{height:24px; flex:none; display:flex; gap:5px; align-items:center; padding:0 9px; background:var(--surface-2); font-family:var(--mono); font-size:10px; color:var(--ink-2)}
.scr .chrome i{width:7px; height:7px; border-radius:50%; background:var(--line); display:block}
.scr .chrome span{margin-left:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.scr .in{padding:10px; display:grid; gap:7px; align-content:start; flex:1; min-height:0; overflow:hidden}
.m-h{font-family:var(--display); font-weight:700; font-size:14px; line-height:1.15}
.m-s{color:var(--ink-2); font-size:11px}
.m-field{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:5px 7px; color:var(--ink-2)}
.m-btn{background:var(--accent); color:var(--surface); border-radius:6px; padding:6px; text-align:center; font-weight:700}
.m-row{display:flex; justify-content:space-between; gap:8px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:5px}
.m-row:last-child{border-bottom:0}
.m-mono{font-family:var(--mono); font-size:10px; color:var(--ink-2); white-space:nowrap}
.m-hot{color:var(--sun); font-weight:700}
.m-chip{display:inline-block; padding:3px 8px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-weight:600}
.m-bar{height:8px; border-radius:4px; background:var(--accent)}
.wa{background:var(--wa-bg)}
.wa .in{gap:6px}
.bub{max-width:85%; padding:6px 8px; border-radius:8px; background:var(--wa-in); box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bub.out{background:var(--wa-out); justify-self:end}
.bub.bot{border:1px dashed var(--leaf)}
.bub small{display:block; font-size:9px; color:var(--ink-2); font-weight:700; text-transform:uppercase; letter-spacing:.06em}
.fl{display:grid; gap:0; justify-items:center}
.fl .n{width:100%; border:1.5px solid var(--line); background:var(--surface); border-radius:7px; padding:4px 8px; display:flex; gap:6px; align-items:baseline}
.fl .n b{font-family:var(--mono); font-size:9px; text-transform:uppercase; color:var(--accent); flex:none}
.fl .n.trg{border-color:var(--accent)}
.fl .ar{width:1.5px; height:9px; background:var(--ink-2)}
.kb{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; flex:1}
.kb .col{background:var(--surface-2); border-radius:6px; padding:5px; display:grid; gap:5px; align-content:start}
.kb .col>b{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-2)}
.kb .cd{background:var(--surface); border-radius:5px; padding:5px; border:1px solid var(--line); font-weight:600; font-size:10.5px}
.kb .cd.hot{border-color:var(--sun); box-shadow:0 0 0 1px var(--sun)}
.task{display:flex; gap:7px; align-items:center}
.task i{width:12px; height:12px; border-radius:3px; border:1.5px solid var(--ink-2); flex:none; display:grid; place-items:center; font-style:normal; font-size:9px}
.task.ok i{background:var(--leaf); border-color:var(--leaf); color:var(--surface)}
.task.ok span{text-decoration:line-through; color:var(--ink-2)}
.mx{position:relative; flex:1; border-left:1.5px solid var(--ink-2); border-bottom:1.5px solid var(--ink-2); margin:0 0 16px 16px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
.mx div{border:1px dashed var(--line); font-size:9.5px; color:var(--ink-2); padding:4px}
.mx div.a{background:var(--leaf-soft); color:var(--leaf); font-weight:700}
.mx .pt{position:absolute; width:14px; height:14px; border-radius:50%; background:var(--sun); border:2px solid var(--surface); transform:translate(-50%,50%); box-shadow:0 0 0 4px color-mix(in srgb, var(--sun) 30%, transparent)}
.mx .ax{position:absolute; font-size:9px; color:var(--ink-2); font-family:var(--mono)}
.nps{display:grid; grid-template-columns:repeat(11,1fr); gap:2px}
.nps span{text-align:center; border-radius:3px; padding:4px 0; font-family:var(--mono); font-size:9.5px; background:var(--surface); border:1px solid var(--line)}
.nps span.sel{background:var(--leaf); color:var(--surface); border-color:var(--leaf); font-weight:700}
.bars{display:grid; gap:6px}
.bars .r{display:grid; grid-template-columns:78px 1fr 44px; gap:6px; align-items:center}
.bars .t{height:10px; border-radius:3px; background:var(--surface-2); overflow:hidden}
.bars .t i{display:block; height:100%; background:var(--accent)}
.em-hd{border-bottom:1px solid var(--line); padding-bottom:6px}
.em-img{height:54px; border-radius:6px; background:linear-gradient(120deg,var(--accent-soft),var(--sea-soft) 60%,var(--sun-soft))}

/* signal log */
.side{display:grid; gap:14px; position:sticky; top:90px}
.scene{margin:0; border-radius:16px; overflow:hidden; position:relative; background:var(--surface-2); aspect-ratio:4/5; max-width:100%}
.scene img{width:100%; height:100%; object-fit:cover; display:block; animation:fade .6s ease}
.scene figcaption{position:absolute; left:0; right:0; bottom:0; padding:28px 14px 12px; color:#fff; font-size:13px; font-weight:600; background:linear-gradient(transparent,rgba(5,15,20,.8))}
@keyframes fade{from{opacity:.3; transform:scale(1.03)}to{opacity:1; transform:none}}
.log{background:var(--log-bg); color:var(--log-ink); border-radius:16px; padding:18px; font-family:var(--mono); font-size:12.5px}
.log h4{margin:0 0 4px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.7; font-weight:600}
.log .note{font-size:11px; opacity:.6; margin-bottom:12px}
.log ol{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.log li{display:grid; grid-template-columns:52px 1fr; gap:8px; animation:rise .4s ease both}
.log time{opacity:.6}
.log .hot{color:var(--log-hot)}
.score{margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,.15)}
.bar{height:8px; background:rgba(255,255,255,.14); border-radius:4px; overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--log-hot); transition:width .6s ease}

/* compare */
.tbl-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px}
table{border-collapse:collapse; width:100%; min-width:640px}
th,td{text-align:left; padding:14px 18px; border-bottom:1px solid var(--line); vertical-align:top; font-size:15px}
thead th{font-family:var(--display); font-size:18px}
tbody th{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); font-weight:600; width:20%}
tr:last-child td,tr:last-child th{border-bottom:0}
.c2c{color:var(--sea)} .c2b{color:var(--b2b)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}

/* flowchart */
.fwrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px}
.fgrid{display:grid; grid-template-columns:150px repeat(4,minmax(180px,1fr)); column-gap:36px; row-gap:12px; min-width:1000px}
.fcol-h{font-family:var(--display); font-weight:700; font-size:17px; display:flex; gap:8px; align-items:baseline; border-bottom:2px solid var(--line); padding-bottom:6px}
.fcol-h span{font-family:var(--mono); font-size:11px; color:var(--ink-2)}
.flane{display:grid; align-content:center; gap:4px; padding-right:6px}
.flane b{font-family:var(--display); font-size:18px}
.flane small{font-size:12px; color:var(--ink-2); line-height:1.35}
.flane.c b{color:var(--sea)} .flane.b b{color:var(--b2b)}
.fnode{position:relative; text-align:left; border-radius:14px; padding:12px 14px; background:var(--surface); border:2px solid var(--sea); display:grid; gap:6px; align-content:start; transition:transform .2s, box-shadow .2s}
.fnode.b{border-color:var(--b2b)}
.fnode:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(10,30,40,.12)}
.fnode strong{font-family:var(--display); font-size:15px; line-height:1.2}
.fnode p{margin:0; font-size:13px; color:var(--ink-2); line-height:1.4}
.fnode .gp{font-size:11.5px; font-weight:700; color:var(--sun); background:var(--sun-soft); border-radius:6px; padding:3px 7px; justify-self:start}
.fnode .sv{font-size:11.5px; font-weight:700; color:var(--leaf); background:var(--leaf-soft); border-radius:6px; padding:3px 7px; justify-self:start}
.fnode:not(.last)::after{content:""; position:absolute; right:-30px; top:50%; width:24px; height:2px; background:var(--ink-2)}
.fnode:not(.last)::before{content:""; position:absolute; right:-31px; top:calc(50% - 5px); border:6px solid transparent; border-left:8px solid var(--ink-2); border-right:0}
.fdiff{display:flex; justify-content:center; align-items:center}
.fdiff span{font-size:12.5px; font-weight:700; padding:5px 12px; border-radius:999px; background:var(--surface-2); border:1px dashed var(--ink-2); text-align:center}
.fprod{display:flex; flex-wrap:wrap; gap:5px; align-content:start}
.floop{margin-top:18px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; border:2px dashed var(--b2b); border-radius:14px; padding:12px 16px; font-size:14px}
.floop b{font-family:var(--display); font-size:16px}
.floop .ic{font-family:var(--mono); font-size:22px; color:var(--b2b)}
.tline{margin-top:24px; display:grid; gap:10px}
.tline h3{font-size:18px}
.tl{display:grid; grid-template-columns:210px 1fr; gap:12px; align-items:center; font-size:13px}
.tl .trk{position:relative; height:26px; background:var(--surface-2); border-radius:6px}
.tl .fill{position:absolute; top:0; bottom:0; border-radius:6px; display:flex; align-items:center; padding-left:10px; color:var(--surface); font-weight:700; font-size:12px; white-space:nowrap}
.tl .ticks{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--ink-2)}

/* intro deck */
.deck{display:grid; gap:14px; padding-block:24px 0}
.slide{position:relative; border-radius:24px; background:var(--surface); border:1px solid var(--line); min-height:clamp(480px,74vh,740px); padding:clamp(24px,5vw,64px); display:grid; align-content:center; gap:clamp(18px,3vh,32px); overflow:hidden; animation:rise .45s ease}
.s-title{font-family:var(--display); font-size:clamp(32px,4.6vw,62px); font-weight:800; line-height:1.03; letter-spacing:-.015em; max-width:20ch; margin:0; text-wrap:balance}
.s-title em{font-style:normal; color:var(--accent)}
.s-lead{font-size:clamp(16px,1.5vw,20px); color:var(--ink-2); max-width:62ch; margin:0}
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(12px,2vw,28px)}
.stat{border-top:3px solid var(--accent); padding-top:14px; display:grid; gap:6px; align-content:start}
.stat b{font-family:var(--display); font-size:clamp(28px,3.4vw,48px); line-height:1; font-weight:800}
.stat span{color:var(--ink-2); font-size:15px}
.segs{display:grid; gap:10px}
.segs small{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips span{padding:7px 14px; border-radius:999px; background:var(--surface-2); font-weight:600; font-size:14px}
.chips span.on{background:var(--accent); color:var(--surface); box-shadow:0 0 0 4px var(--accent-soft)}
.units{display:grid; grid-template-columns:1fr auto 1fr; grid-template-areas:"g core rd" "g core tf"; gap:16px 28px; align-items:center}
.unit{border:1px solid var(--line); border-radius:18px; padding:20px 22px; background:var(--surface-2); display:grid; gap:6px}
.unit h3{font-size:22px}
.unit p{margin:0; color:var(--ink-2); font-size:15px}
.unit.on{border:2px solid var(--accent); background:var(--accent-soft)}
.unit.on h3{color:var(--accent)}
.core{grid-area:core; width:clamp(150px,16vw,210px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; text-align:center; background:radial-gradient(circle at 40% 35%, var(--accent-soft), var(--surface) 70%); border:2px dashed var(--accent); font-family:var(--display); font-weight:800; font-size:clamp(22px,2.4vw,32px); letter-spacing:.06em}
.core small{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--ink-2); font-weight:600}
.pillars{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:14px; align-items:stretch}
.pillar{border-radius:18px; padding:22px; background:var(--surface-2); display:grid; gap:12px; align-content:start}
.pillar h3{font-size:clamp(20px,2vw,26px)}
.pillar ul{margin:0; padding:0; list-style:none; display:grid; gap:8px}
.pillar li{padding-left:18px; position:relative; font-size:15px}
.pillar li::before{content:""; position:absolute; left:0; top:.55em; width:8px; height:8px; border-radius:2px; background:var(--accent)}
.pillar .prod{justify-self:start}
.pillar:nth-of-type(1) .step{color:var(--sea)} 
.step{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.parrow{display:grid; place-items:center; font-family:var(--mono); font-size:24px; color:var(--accent)}
.bridge{display:flex; flex-wrap:wrap; gap:14px 20px; align-items:center; justify-content:space-between; border-radius:16px; padding:18px 22px; background:var(--log-bg); color:var(--log-ink)}
.bridge b{font-family:var(--display); font-size:clamp(18px,1.8vw,22px)}
.bridge button{border:0; background:var(--log-hot); color:#1b0f08; font-weight:800; padding:12px 18px; border-radius:12px; font-size:15px}
.deck-nav{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.dots{display:flex; gap:8px; align-items:center}
.dots button{width:34px; height:6px; border-radius:3px; border:0; background:var(--line); padding:0}
.dots button[aria-current="true"]{background:var(--accent); width:56px}
.deck-nav .cnt{font-family:var(--mono); font-size:12px; color:var(--ink-2)}
.srcnote{font-size:12px; color:var(--ink-2); margin:0}

/* cover: single deliberate look (Rio ao entardecer), independent of theme */
.slide.cover{background:linear-gradient(180deg,#0A2B38 0%,#0C4550 45%,#12656B 70%,#B8744F 92%,#E79A68 100%); color:#F3F8F8; border:0; display:flex; flex-direction:column; gap:clamp(16px,3vh,28px); padding-bottom:0; --accent:#63D6CF; --pad:clamp(24px,5vw,64px)}
.cover .rio{display:block; margin:auto calc(-1*var(--pad)) 0; width:calc(100% + 2*var(--pad)); max-width:none; height:auto; aspect-ratio:1200/330}
@media (min-width:901px){
  .slide.cover{padding-bottom:clamp(120px,19vh,190px)}
  .cover .rio{position:absolute; left:0; bottom:0; margin:0; width:100%; height:clamp(240px,46%,400px); aspect-ratio:auto}
  .cover-body{max-width:min(720px,56%)}
  .cover .s-title{font-size:clamp(36px,4.8vw,66px)}
}
.cover-top{position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:12px 20px; justify-content:space-between; align-items:center}
.wordmark{display:flex; align-items:center; gap:14px; font-family:var(--display); font-weight:800; letter-spacing:.08em; font-size:clamp(20px,2vw,26px)}
.wordmark i{width:1px; height:26px; background:rgba(243,248,248,.45)}
.wordmark span{font-weight:700; letter-spacing:.01em; font-size:.85em}
.event{font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; border:1px solid rgba(243,248,248,.35); border-radius:999px; padding:7px 14px}
.cover-body{position:relative; z-index:1; display:grid; gap:18px; max-width:760px; padding-top:clamp(12px,4vh,40px)}
.cover .s-title{font-size:clamp(36px,5.6vw,76px); max-width:16ch; text-shadow:0 2px 24px rgba(4,20,28,.4)}
.cover .s-lead{color:#C8DEE0; max-width:52ch}
.cover .eyebrow{color:#F5B37A}
.presenter{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:14px; color:#DCEBEC}
.presenter b{font-family:var(--display); font-size:16px; color:#fff}
.coords{position:absolute; right:var(--pad); top:calc(var(--pad) + 52px); z-index:1; font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:rgba(243,248,248,.75); text-align:right}
@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .units{grid-template-columns:1fr; grid-template-areas:"core" "g" "rd" "tf"}
  .core{justify-self:center}
  .pillars{grid-template-columns:1fr}
  .parrow{transform:rotate(90deg); height:20px}
  .coords{display:none}
}
@media (max-width:480px){ .stats{grid-template-columns:1fr} }

/* rd station mandala */
.mandala{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:8px}
.quad{--q:var(--sea); --qs:var(--sea-soft); background:var(--surface); border:1px solid var(--line); padding:22px; display:grid; gap:14px; align-content:start; min-height:250px}
.quad.q1{border-radius:28px 12px 12px 12px; padding-right:clamp(22px,8vw,110px)}
.quad.q2{--q:var(--leaf); --qs:var(--leaf-soft); border-radius:12px 28px 12px 12px; padding-left:clamp(22px,8vw,110px)}
.quad.q3{--q:var(--b2b); --qs:var(--b2b-soft); border-radius:12px 12px 12px 28px; padding-right:clamp(22px,8vw,110px)}
.quad.q4{--q:var(--sun); --qs:var(--sun-soft); border-radius:12px 12px 28px 12px; padding-left:clamp(22px,8vw,110px)}
.quad.q2,.quad.q4{text-align:right}
.quad.q2 .tiles,.quad.q4 .tiles{justify-content:flex-end}
.qh{display:grid; gap:2px}
.qh .step{color:var(--q)}
.qh h3{font-size:clamp(20px,2vw,26px)}
.qh p{margin:0; font-size:13.5px; color:var(--ink-2)}
.tiles{display:flex; flex-wrap:wrap; gap:10px}
.tile{display:flex; align-items:center; gap:10px; text-align:left; border:1.5px solid var(--line); background:var(--bg); border-radius:14px; padding:10px 14px 10px 10px; transition:transform .18s, border-color .18s, box-shadow .18s}
.tile:hover,.tile:focus-visible{transform:translateY(-2px); border-color:var(--q); box-shadow:0 8px 20px rgba(10,30,40,.12)}
.mono{width:40px; height:40px; flex:none; border-radius:11px; display:grid; place-items:center; background:var(--q); color:var(--surface); font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:-.02em}
.mono.sm{font-size:12px; letter-spacing:-.03em}
.tile{flex-direction:column; align-items:stretch; width:184px; padding:8px; gap:8px; position:relative}
.plate{height:76px; border-radius:10px; display:grid; place-items:center; padding:10px 14px; background:#fff; border:1px solid rgba(0,0,0,.06); overflow:hidden}
.plate img{width:100%; height:100%; min-height:0; object-fit:contain; display:block}
.plate:not(.txt){grid-template-rows:minmax(0,1fr); grid-template-columns:minmax(0,1fr)}
.plate.txt{background:var(--q); color:#fff; font-family:var(--display); font-weight:800; font-size:17px; line-height:1.1; text-align:center; border:0}
.tile .cap{font-size:12px; color:var(--ink-2); text-align:left; padding:0 4px 2px; line-height:1.25}
.tile .badge{position:absolute; top:4px; right:4px; font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:var(--log-bg); color:var(--log-ink); padding:3px 7px; border-radius:6px}
.sc-head .plate{height:88px; width:clamp(150px,22vw,220px)}
.sc-head .plate.txt{font-size:20px}
.sc-head .mono.sm{font-size:18px}
.tile .nm{display:grid; line-height:1.15}
.tile .nm b{font-family:var(--display); font-size:15.5px; font-weight:700}

.hub{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(150px,15vw,190px); aspect-ratio:1; border-radius:50%; background:var(--log-bg); color:var(--log-ink); display:grid; place-items:center; text-align:center; box-shadow:0 0 0 10px var(--bg), 0 0 0 11px var(--line); z-index:2; pointer-events:none}
.hub b{font-family:var(--display); font-size:clamp(18px,1.8vw,24px); display:block; line-height:1.05}
.hub small{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; opacity:.7}
.rd-foot{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-top:18px}
.rd-foot p{margin:0; font-size:13px; color:var(--ink-2); max-width:70ch}
/* modal */
.modal{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:rgba(4,14,18,.55); backdrop-filter:blur(3px); animation:fadein .2s ease}
[hidden]{display:none!important}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet-card{--q:var(--sea); --qs:var(--sea-soft); width:min(860px,100%); max-height:min(88vh,860px); overflow:auto; background:var(--surface); color:var(--ink); border-radius:22px; box-shadow:0 30px 80px rgba(0,0,0,.35); animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(14px) scale(.98); opacity:.4}to{transform:none; opacity:1}}
.sc-head{display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; padding:22px 24px; background:var(--qs); border-bottom:1px solid var(--line)}
.sc-head .mono{width:64px; height:64px; border-radius:16px; font-size:22px}
.sc-head h2{font-size:clamp(22px,2.6vw,30px)}
.sc-head .cat{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--q); font-weight:600}
.sc-x{border:1px solid var(--line); background:var(--surface); width:40px; height:40px; border-radius:50%; font-size:18px; align-self:start}
.sc-body{padding:22px 24px 24px; display:grid; gap:18px}
.sc-tag{font-size:clamp(17px,1.6vw,20px); font-weight:600; margin:0; line-height:1.4}
.sc-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:18px}
.sc-body h4{margin:0 0 8px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); font-weight:600}
.sc-body p{margin:0; color:var(--ink-2)}
.feat{display:flex; flex-wrap:wrap; gap:8px}
.feat span{padding:6px 11px; border-radius:999px; background:var(--qs); color:var(--ink); font-size:13.5px; font-weight:600}
.big-stat{border-left:4px solid var(--q); padding:4px 0 4px 14px}
.big-stat b{display:block; font-family:var(--display); font-size:clamp(28px,3vw,40px); line-height:1; color:var(--q)}
.big-stat span{font-size:13.5px; color:var(--ink-2)}
.hotel{border-radius:14px; padding:14px 16px; background:var(--log-bg); color:var(--log-ink); display:grid; gap:4px}

@media (max-width:900px){

  .sc-grid{grid-template-columns:1fr}
}

/* plan */

.mod{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; display:grid; gap:10px; align-content:start}
.mod h3{font-size:22px}

kbd{font-family:var(--mono); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; background:var(--surface)}

@media (max-width:1000px){
  .shots{grid-template-columns:1fr 1fr}
}

  .hero,.stage{grid-template-columns:1fr}

}

<script>
const PROD = {mkt:["RD Station Marketing","p-mkt"], crm:["RD Station CRM","p-crm"], cnv:["RD Station Conversas","p-cnv"]};

/* ---------- mock screens ---------- */
const esc = s => String(s);
const chrome = t => `<div class="chrome"><i></i><i></i><i></i><span>${t}</span></div>`;
const MOCK = {
  lp:o=>`<div class="scr">${chrome(o.url)}<div class="in"><div class="m-h">${o.t}</div><div class="m-s">${o.sub}</div>${o.fields.map(f=>`<div class="m-field">${f}</div>`).join('')}<div class="m-btn">${o.cta}</div></div></div>`,
  track:o=>`<div class="scr">${chrome('Lead Tracking · '+o.who)}<div class="in">${o.items.map(i=>`<div class="m-row"><span class="${i[2]?'m-hot':''}">${i[1]}</span><span class="m-mono">${i[0]}</span></div>`).join('')}</div></div>`,
  ads:o=>`<div class="scr">${chrome('Segmentações')}<div class="in">${o.segs.map(s=>`<div class="m-row"><span><b>${s[0]}</b><br><span class="m-s">${s[1]}</span></span><span class="m-mono">${s[2]} contatos</span></div>`).join('')}<div class="m-s">Enviar público para:</div><div style="display:flex;gap:6px;flex-wrap:wrap">${o.dest.map(d=>`<span class="m-chip">${d}</span>`).join('')}</div></div></div>`,

  flow:o=>`<div class="scr">${chrome('Automação · '+o.name)}<div class="in"><div class="fl">${o.steps.map((s,i)=>`${i?'<div class="ar"></div>':''}<div class="n ${i===0?'trg':''}"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></div></div>`,
  score:o=>`<div class="scr">${chrome('Lead Scoring')}<div class="in" style="display:flex;flex-direction:column"><div class="m-row"><b>${o.who}</b><span class="m-mono">Perfil ${o.x} · Interesse ${o.y}</span></div><div class="mx"><div>Perfil alto · interesse baixo</div><div class="a">Pronto para reservar</div><div>Baixo · baixo</div><div>Interesse alto · perfil baixo</div><span class="pt" style="left:${o.x}%;bottom:${o.y}%"></span><span class="ax" style="left:-14px;top:40%;transform:rotate(-90deg)">interesse</span><span class="ax" style="bottom:-15px;left:40%">perfil</span></div></div></div>`,

};


Object.assign(MOCK,{
  stat:o=>`<div class="scr">${chrome(o.name)}<div class="in"><div class="m-big">${o.big}</div><div><b>${o.label}</b></div>${o.rows.map(r=>`<div class="m-row"><span>${r[0]}</span><b class="${r[2]?'m-hot':''}">${r[1]}</b></div>`).join('')}</div></div>`,

  inbox:o=>`<div class="scr">${chrome(o.name)}<div class="in">${o.items.map(m=>`<div class="mail ${m[3]?'fl':''}"><b>${m[0]}</b><span class="m-mono">${m[2]}</span><span>${m[1]}</span></div>`).join('')}${o.note?`<div class="m-s m-hot">${o.note}</div>`:''}</div></div>`,
  sheet:o=>{const g=`grid-template-columns:${o.w}`; return `<div class="scr">${chrome(o.file)}<div class="in"><div class="sheet"><div class="h" style="${g}">${o.head.map(h=>`<span>${h}</span>`).join('')}</div>${o.rows.map(r=>`<div style="${g}">${r.map(c=>`<span class="${String(c).startsWith('!')?'bad':''}">${String(c).replace(/^!/,'')}</span>`).join('')}</div>`).join('')}</div>${o.note?`<div class="m-s m-hot">${o.note}</div>`:''}</div></div>`;},
  sticky:o=>`<div class="scr">${chrome(o.name)}<div class="in"><div class="stk">${o.notes.map(n=>`<span>${n}</span>`).join('')}</div></div></div>`
});

/* cenas dos gargalos: [mock, params, legenda] por etapa */

 b2c:[
  [[["stat",{name:"Analytics do site · última semana",big:"98,7%",label:"das visitas sem identificação",rows:[["Visitas no site","3.220"],["Contatos gerados","42"],["Sabemos quem é a Juliana?","Não",1]]}],"O hotel vê tráfego, mas não vê pessoas."],

function unflipNow(fw){ fw.classList.remove('flipped'); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; const k=fw.dataset.key; const done=()=>{ if(flipped!==k) fw.classList.remove('showback'); }; reduce?done():setTimeout(done,760); }
function toggleFlip(key){
  if(!key) key = reveal>=3 ? 'sol' : (reveal>=2 ? 'gap' : null);
  const fw=app.querySelector(`.flipwrap[data-key="${key}"]`); if(!fw) return;
  if(key==='gap' && reveal<2) return; if(key==='sol' && reveal<3) return;
  if(flipped===key){ flipped=null; unflipNow(fw); return; }
  if(flipped){ const o=app.querySelector(`.flipwrap[data-key="${flipped}"]`); flipped=null; if(o) unflipNow(o); }
  flipped=key;
  fw.classList.add('showback');
  requestAnimationFrame(()=>requestAnimationFrame(()=>fw.classList.add('flipped')));
  setTimeout(()=>fw.scrollIntoView({behavior:'smooth',block:'nearest'}),200);
}

  const step=()=>reveal===1?0:reveal===2?(flipped==='gap'?2:1):(flipped==='sol'?4:3);
  function paint(){
    let t=NAMES[view];
    if(view==='intro') t+=` · ${islide+1}/${INTRO.length} · ${INTRO[islide].label}`;
    else if(isJ()) t+=` · etapa ${stage+1}/4 · ${STEP[step()]}`;
    else if(view==='rd') t+= openSol===null ? ` · mandala` : ` · solução ${openSol+1}/${SOLS.length} · ${SOLS[openSol].n}`;
    stat.textContent=t;
    requestAnimationFrame(fit); setTimeout(fit,850);
  }
  // encolhe levemente o conteúdo quando ele passa da altura da tela (nada fica cortado)
  function fit(){ const kids=[...app.children]; kids.forEach(c=>c.style.zoom=''); const r=app.clientHeight/app.scrollHeight; if(r<1){ const z=Math.max(r-0.004,0.75); kids.forEach(c=>c.style.zoom=z); } app.scrollTop=0; }
  function vid(){ return view==='intro'&&islide===0 ? app.querySelector('video') : null; }
  function goJ(st,rv,fl){ stage=st; reveal=rv; flipped=fl; render(); }

  function pNext(){
    const v=vid();
    if(v && !v._tried && v.paused && v.currentTime<0.5){ v._tried=1; v.play().catch(()=>{}); return; }
    if(v) v.pause();
    if(isJ()){
      const s=step();
      if(s===0){ goJ(stage,2,null); return; }
      if(s===1){ toggleFlip('gap'); return; }
      if(s===2){ goJ(stage,3,null); return; }
      if(s===3){ toggleFlip('sol'); return; }
      if(stage<3){ goJ(stage+1,1,null); return; }
    }
    if(view==='rd'){
      if(openSol===null){ openSolution(0); return; }
      if(openSol<SOLS.length-1){ openSolution(openSol+1); return; }
      closeSol();
    }
    if(view==='intro' && islide<INTRO.length-1){ islide++; render(); return; }
    const i=ORDER.indexOf(view); if(i<ORDER.length-1) setView(ORDER[i+1]);
  }
  function pPrev(){
    const v=vid(); if(v) v.pause();
    if(isJ()){
      const s=step();
      if(s===4){ toggleFlip('sol'); return; }
      if(s===3){ goJ(stage,2,'gap'); return; }
      if(s===2){ toggleFlip('gap'); return; }
      if(s===1){ goJ(stage,1,null); return; }
      if(stage>0){ goJ(stage-1,3,'sol'); return; }
    }
    if(view==='rd' && openSol!==null){ openSol>0 ? openSolution(openSol-1) : closeSol(); return; }
    if(view==='intro'){ if(islide>0){ islide--; render(); } return; }
    const i=ORDER.indexOf(view); if(i<=0) return;
    view=ORDER[i-1]; stage=0; reveal=1; flipped=null;
    if(isJ()){ stage=3; reveal=3; flipped='sol'; }
    if(view==='intro') islide=INTRO.length-1;
    render(); window.scrollTo({top:0});
    if(view==='rd') openSolution(SOLS.length-1);
  }
  const NEXT=['ArrowRight','ArrowDown','PageDown',' ','Enter','MediaTrackNext'];
  const PREV=['ArrowLeft','ArrowUp','PageUp','Backspace','MediaTrackPrevious'];
  window.addEventListener('keydown',e=>{
    if(e.target.closest && e.target.closest('input,textarea')) return;
    const k=e.key;
    if(k==='F5'){ e.preventDefault(); e.stopImmediatePropagation(); toggleFS(); return; }
    if(k==='b'||k==='B'||k==='.'||k==='w'||k==='W'){ e.preventDefault(); e.stopImmediatePropagation(); black.classList.toggle('on'); return; }
    const n=NEXT.includes(k), p=PREV.includes(k);
    if(!n&&!p) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if(black.classList.contains('on')){ black.classList.remove('on'); return; }
    if(openSol!==null && view!=='rd'){ closeSol(); }
    if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
    n ? pNext() : pPrev();
    paint();
  },true);

  const _open=openSolution, _close=closeSol;
  openSolution=function(i){ _open(i); paint(); const t=document.querySelector('.tile[data-sol="'+i+'"]'); document.querySelectorAll('.tile.cur').forEach(x=>x.classList.remove('cur')); if(t) t.classList.add('cur'); };
  closeSol=function(){ _close(); paint(); try{document.body.focus({preventScroll:true});}catch(e){} };
  const _render=render;
  render=function(){ _render(); paint(); };
  // botões na tela também passam pela mesma sequência
  next=pNext; prev=pPrev;

  let ct; function showCursor(){ document.body.classList.remove('nocursor'); stat.style.opacity=1; clearTimeout(ct); ct=setTimeout(()=>document.body.classList.add('nocursor'),2500); }
  addEventListener('mousemove',showCursor); showCursor();
  // o vídeo não pode segurar o foco do teclado (senão o passador para de responder)
  const unstick=()=>{ try{ window.focus(); }catch(e){} const a=document.activeElement; if(!a||a.tagName==='VIDEO'||a===document.body){ if(a&&a.blur) a.blur(); document.body.focus({preventScroll:true}); } };
  ['pointerdown','mousedown'].forEach(t=>document.addEventListener(t,()=>{ try{ window.focus(); }catch(e){} },true));
  document.addEventListener('focusin',e=>{ if(e.target&&e.target.tagName==='VIDEO') setTimeout(unstick,0); },true);
  ['play','pause','click','pointerup'].forEach(t=>document.addEventListener(t,()=>setTimeout(unstick,0),true));
  document.body.tabIndex=-1;
  function focusState(){ wake.classList.toggle('on', !document.hasFocus()); }
  addEventListener('focus',focusState); addEventListener('blur',focusState); setInterval(focusState,1000); focusState();
  paint();
})();
</script>


</body></html>
