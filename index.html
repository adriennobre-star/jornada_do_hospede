<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jornada do Hóspede RD</title>
    <link rel="stylesheet" href="css/fontes.css" />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <div id="stage">
      <div class="wrap">
        <header class="top">
          <div class="brand">
            <b>Jornada do Hóspede</b><span>TOTVS Day Rio · Hospitality × RD Station</span>
          </div>
          <div class="top-right">
            <nav class="tabs" role="tablist" aria-label="Visão">
              <button role="tab" id="t-intro" data-view="intro" aria-selected="true">Abertura</button>
              <button role="tab" id="t-rd" data-view="rd" aria-selected="false">RD Station</button>
              <button role="tab" id="t-b2c" data-view="b2c" aria-selected="false">Hóspede B2C</button>
              <button role="tab" id="t-b2b" data-view="b2b" aria-selected="false">Conta B2B</button>
              <button role="tab" id="t-cmp" data-view="cmp" aria-selected="false">B2C × B2B</button>
              <button role="tab" id="t-flow" data-view="flow" aria-selected="false">Fluxograma</button>
              <button role="tab" id="t-plan" data-view="plan" aria-selected="false">Plano RD Station</button>
            </nav>
            <button class="fs-btn" id="fsBtn" type="button">⛶ Tela cheia</button>
            <button class="theme-btn" id="themeBtn" type="button">
              <span class="ico" aria-hidden="true"></span><span id="themeLbl">Modo escuro</span>
            </button>
          </div>
        </header>
        <main id="app"></main>
        <p class="hint">
          Passador: avançar/voltar percorrem tudo · <kbd>B</kbd> tela preta · <kbd>F5</kbd> tela cheia ·
          <kbd>1</kbd>–<kbd>7</kbd> trocam a visão · <kbd>G</kbd> gira o último card aberto ·
          <kbd>T</kbd> alterna o tema
        </p>
      </div>
    </div>
    <script src="js/apresentacao.js"></script>
    <script src="js/passador.js"></script>
  </body>
</html>
